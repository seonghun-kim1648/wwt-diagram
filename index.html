<title>청주SEC WT/WWT 공정모식도</title>
<style>
  :root{ color-scheme:dark; --bg:#0b131b; --card:#111c26; --line:#28404f; --ink:#e3eef4; --ink2:#a9bfcc; --accent:#3ecfb0; --accent-ink:#04261f; --bad:#e8636b; }
  @media (prefers-color-scheme: light){ :root{ color-scheme:light; --bg:#eef3f6; --card:#fff; --line:#bfcfd9; --ink:#0f1f2a; --ink2:#3c5464; --accent:#0c8f77; --accent-ink:#fff; --bad:#c23b45; } }
  *{box-sizing:border-box;} html,body{margin:0; height:100%;}
  body{background:var(--bg); color:var(--ink); font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif; display:grid; place-items:center; padding:16px;}
  form{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; width:100%; max-width:360px; display:flex; flex-direction:column; gap:12px;}
  small{font-size:11px; letter-spacing:.08em; color:var(--ink2); font-weight:600;}
  h1{margin:0; font-size:18px;}
  p{margin:0; font-size:13px; color:var(--ink2); line-height:1.5;}
  input[type=password]{background:transparent; border:1px solid var(--line); border-radius:8px; padding:11px 12px; font-size:15px; color:var(--ink);}
  input[type=password]:focus{outline:2px solid var(--accent); border-color:var(--accent);}
  label{display:flex; gap:8px; align-items:center; font-size:13px; color:var(--ink2);}
  button{background:var(--accent); color:var(--accent-ink); border:none; border-radius:8px; padding:11px; font-size:14px; font-weight:700; cursor:pointer;}
  button[disabled]{opacity:.6; cursor:wait;}
  .err{color:var(--bad); font-size:13px; min-height:18px;}
</style>
</head>

  var b64=function(s){ return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);}); };
  var KEY='wwt_key_v1';
  function show(key){

      document.open(); document.write(html); document.close();

  function derive(pw){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function(base){
